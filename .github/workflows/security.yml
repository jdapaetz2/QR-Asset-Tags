name: Security (executed RLS/storage)

# Executed security suite (Phase A3.2). Runs the real Postgres/Auth/Storage boundary tests against a
# throwaway LOCAL Supabase stack — never a hosted project (the suite's stack.ts refuses any
# non-loopback host). The local stack's keys are public CLI fixtures, so NO repository secrets are
# needed. Docker is preinstalled on ubuntu-latest.
#
# Cadence (approved): nightly + every pull request + manual dispatch. It is heavier than the unit
# gates (container boot + migrations ≈ 3–5 min), so it is a separate workflow from ci.yml.

on:
  schedule:
    - cron: "17 6 * * *" # 06:17 UTC nightly
  pull_request:
  workflow_dispatch:

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  executed-rls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Start local Supabase stack
        run: npx supabase start

      - name: Executed security suite (db reset + RLS/storage/RPC)
        run: npm run test:security

      - name: Stop local Supabase stack
        if: always()
        run: npx supabase stop --no-backup
