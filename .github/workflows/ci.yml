name: CI

on:
  push:
    # main is the release line; pilot-credibility is the active Phase A hardening
    # branch, so gates run on its direct pushes too (Phase A2).
    branches: [main, pilot-credibility]
  pull_request:

# Cancel superseded runs on the same ref (a new push aborts the previous run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production config (static)
        run: npm run verify:production-config

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public env vars must be present at build time. Placeholders are fine
          # for the build/typecheck gate; real values come from Vercel settings.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

  # Secret scanning (Phase A3.2). Runs the gitleaks release BINARY directly — no marketplace
  # action, no license key, and nothing about the repository is uploaded anywhere. --redact means a
  # finding fails the job without printing the value. fetch-depth: 0 so full history is scanned.
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        env:
          GITLEAKS_VERSION: 8.18.4
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" -o gitleaks.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . --config .gitleaks.toml --redact --no-banner --exit-code 1
