name: CI

on:
  push:
    # main is the release line; pilot-credibility is the active Phase A hardening
    # branch, so gates run on its direct pushes too (Phase A2).
    branches: [main, pilot-credibility]
  pull_request:

# Cancel superseded runs on the same ref (a new push aborts the previous run).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify production config (static)
        run: npm run verify:production-config

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
        env:
          # Public env vars must be present at build time. Placeholders are fine
          # for the build/typecheck gate; real values come from Vercel settings.
          NEXT_PUBLIC_SUPABASE_URL: https://placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: placeholder-anon-key
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
