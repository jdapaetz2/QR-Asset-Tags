  <!-- wheels -->
  <circle cx="250" cy="280" r="30" fill="#334155"/>
  <circle cx="250" cy="280" r="12" fill="#94a3b8"/>
  <circle cx="360" cy="280" r="30" fill="#334155"/>
  <circle cx="360" cy="280" r="12" fill="#94a3b8"/>
  <!-- body + cab -->
