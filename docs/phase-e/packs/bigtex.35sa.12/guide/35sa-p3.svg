<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="35sa-p3-title 35sa-p3-desc">
<title id="35sa-p3-title">Cross the chains</title>
<desc id="35sa-p3-desc">4 frames. 1. Do: Chains crossed in an X under the coupler and hooked to the truck's chain loops (top view). 2. Do: Each S-hook goes into its loop from underneath. 3. Check: Enough slack to turn, clear of the road. 4. Don't: A chain hooked to the ball mount, an interchangeable hitch part.</desc>
