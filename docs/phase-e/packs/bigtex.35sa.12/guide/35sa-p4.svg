<title id="35sa-p4-title">Plug in, check lights</title>
<desc id="35sa-p4-desc">4 frames. 1. Do: Connect the 4-way plug while a helper watches the lights. 2. Check: Truck lights on: both tail lights glow. 3. Check: Brake pedal pressed: both brake lights are bright. 4. Check: Turn signals: the left lamp flashes for left and the right lamp for right.</desc>
