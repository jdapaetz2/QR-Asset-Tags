<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="35sa-p5-title 35sa-p5-desc">
<title id="35sa-p5-title">Tires and wheels</title>
<desc id="35sa-p5-desc">4 frames. 1. Check: Set the pressure printed on the trailer's VIN label, with a gauge. 2. Check: Check it cold: a hot tire is rejected, a cold one is right. 3. Check: Lug nuts tight (no torque number: Big Tex publishes none). 4. Don't: Tires with bald spots, bulges, cuts or showing cords.</desc>
