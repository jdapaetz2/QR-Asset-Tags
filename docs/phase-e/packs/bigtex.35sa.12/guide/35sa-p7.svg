<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="35sa-p7-title 35sa-p7-desc">
<title id="35sa-p7-title">Strap and latch</title>
<desc id="35sa-p7-desc">4 frames. 1. Do: Strap the load to the tie-down loops, with the trailer hitched. 2. Check: Straps run to the bed's tie-down loops (top view). 3. Do: Gate up and latched, with a pin in the latch. 4. Don't: An unlatched gate drops cargo on the road.</desc>
