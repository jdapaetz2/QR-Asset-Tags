<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="35sa-p6-title 35sa-p6-desc">
<title id="35sa-p6-title">Load it right</title>
<desc id="35sa-p6-desc">4 frames. 1. Do: About 60% of the load in the front half and the heaviest item low over the axle, with the trailer hitched and level. 2. Check: Trailer and load together: 2,995 lb at most. 3. Do: Hitch up first, then load. 4. Don't: Loading on a slope can tip the trailer.</desc>
