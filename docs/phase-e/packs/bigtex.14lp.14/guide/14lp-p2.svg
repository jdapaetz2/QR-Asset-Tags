<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="14lp-p2-title 14lp-p2-desc">
<title id="14lp-p2-title">Chains and breakaway</title>
<desc id="14lp-p2-desc">4 frames. 1. Do: Chains crossed in an X under the coupler; the breakaway cable runs to the truck (top view). 2. Close-up: The cable is shorter than the chain slack, so it pulls first. 3. Check: Test: pin out, the trailer brakes hold, pin straight back in. 4. Don't: The breakaway cable clipped to a safety chain.</desc>
