<title id="14lp-p6-title">Raise in stages</title>
<desc id="14lp-p6-desc">4 frames. 1. Do: Raise the body to about ½ (dashed outline), then look behind. 2. Do: Raise it to about ¾, then look behind again. 3. Check: The operator stands well clear of the body and the dump area, remote in hand. 4. Don't: Walking away while the body is up.</desc>
