<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" width="480" height="360" role="img" aria-labelledby="14lp-p1-title 14lp-p1-desc">
<title id="14lp-p1-title">Couple and lock</title>
<desc id="14lp-p1-desc">3 frames. 1. Do: Lower the coupler onto a 2-5/16 in ball rated 14,000 lb or more, latch it and pin it. 2. Check: Test: the jack lifts the hitch no more than 1 in, then lowers it. 3. Do: Raise the jack fully.</desc>
