<title id="14lp-p7-title">Stuck load: lower first</title>
<desc id="14lp-p7-desc">4 frames. 1. Don't: Someone under the raised body. 2. Don't: Jerking the hoist control to shake the load loose. 3. Don't: Braking hard to shake the load loose. 4. Check: Body lowered; the load freed by hand.</desc>
