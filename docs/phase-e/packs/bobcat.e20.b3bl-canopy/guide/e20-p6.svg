<title id="e20-p6-title">Keep people clear</title>
<desc id="e20-p6-desc">3 frames. 1. Check: People stay outside the swing area. 2. Do: Look where you will travel or swing before moving. 3. Don't: Lifting the boom or bucket over a person.</desc>
